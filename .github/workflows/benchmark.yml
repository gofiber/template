name: Benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - "master"
      - "main"
    paths:
      - "**/*.go"
      - "**/go.mod"
      - ".github/workflows/benchmark.yml"
  pull_request:
    paths:
      - "**/*.go"
      - "**/go.mod"
      - ".github/workflows/benchmark.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  deployments: write
  contents: write
  pull-requests: write

jobs:
  benchmark:
    uses: gofiber/.github/.github/workflows/benchmark.yml@main
    with:
      multi-module: true
      # ~3 months of default-branch pushes (32 in the last 90 days)
      max-items-in-chart: 35

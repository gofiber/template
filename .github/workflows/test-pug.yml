on:
    push:
        branches:
            - master
            - main
        paths:
            - 'pug/**'
    pull_request:
        branches:
            - '*'
        paths:
            - 'pug/**'
    workflow_dispatch:
name: Tests Pug

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
    Tests:
        strategy:
            matrix:
                go-version:
                    - 1.25.x
                platform: [ blacksmith-4vcpu-ubuntu-2404, blacksmith-4vcpu-windows-2025 ]
        runs-on: ${{ matrix.platform }}
        timeout-minutes: 30
        steps:
            -   name: Fetch Repository
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            -   name: Install Go
                uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
                with:
                    go-version: '${{ matrix.go-version }}'
                    check-latest: true
                    cache-dependency-path: pug/go.sum
            -   name: Run Test
                uses: gofiber/.github/.github/actions/gotestsum@main
                with:
                    working-directory: ./pug
                    packages: ./...
                    rerun-fails: '2'
                    args: -race -count=1
